version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/apptests"
    schedule:
      interval: "weekly"
    groups:
      go_modules:
        patterns: ["*"]
    ignore:
      # upstream mesosphere/kommander-applications apptests still needs docker/cli v28 (authConfig.Email)
      - dependency-name: "github.com/docker/cli"
        update-types: ["version-update:semver-major"]
