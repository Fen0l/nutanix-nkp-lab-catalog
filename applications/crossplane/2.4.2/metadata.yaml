overview: |
  ## Crossplane

  Crossplane (CNCF) turns Kubernetes into a universal control plane: install providers (AWS,
  Azure, GCP, Nutanix community provider, Kubernetes, Helm...), define `Composition`s and
  offer self-service APIs (`CompositeResourceDefinition`) to developers.

  **At a glance**
  - Chart: `crossplane` 2.4.2, mirrored unchanged from https://charts.crossplane.io/stable to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/crossplane`
  - Installs into: namespace `crossplane-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: crossplane-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into
  `crossplane-system`. Providers are installed afterwards as `Provider` resources.

  **Example**
  ```yaml
  apiVersion: pkg.crossplane.io/v1
  kind: Provider
  metadata: { name: provider-kubernetes }
  spec: { package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.0.0 }
  ```

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://charts.crossplane.io/stable); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://docs.crossplane.io/) · [Marketplace](https://marketplace.upbound.io/) · [Chart](https://github.com/crossplane/crossplane/tree/main/cluster/charts/crossplane) · [Default values](https://github.com/crossplane/crossplane/blob/main/cluster/charts/crossplane/values.yaml) · [Releases](https://github.com/crossplane/crossplane/releases)
