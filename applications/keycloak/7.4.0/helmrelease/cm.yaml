apiVersion: v1
data:
  values.yaml: |
    # --- NKP integration (lab catalog). The keycloakx chart is a bare chart: it needs a start
    # command, a database and an admin account to run at all (see the chart README quickstart).
    command:
      - /opt/keycloak/bin/kc.sh
      - start
      - --http-port=8080
      - --hostname-strict=false
    http:
      relativePath: /keycloak        # served natively under /keycloak on the NKP Traefik
    database:
      vendor: dev-file               # lab: embedded H2 on the pod filesystem (not for production)
    proxy:
      mode: xforwarded               # the NKP Traefik sends X-Forwarded-* headers (chart default: forwarded)
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: admin
      - name: JAVA_OPTS_APPEND
        value: -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
    ingress:
      enabled: true
      ingressClassName: kommander-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
      rules:
        - host: ""
          paths:
            - path: /keycloak/
              pathType: Prefix
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
---
