overview: |
  ## Sealed Secrets

  Sealed Secrets (Bitnami Labs, CNCF sandbox) solves "how do I commit Secrets to Git": the
  `kubeseal` CLI encrypts a Secret with the controller's public key into a `SealedSecret`
  resource that only the controller in the cluster can decrypt. A natural companion to the NKP
  Flux GitOps workflow.

  **At a glance**
  - Chart: `sealed-secrets` 2.20.0, mirrored unchanged from https://bitnami.github.io/sealed-secrets to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/sealed-secrets`
  - Installs into: namespace `kube-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `sealed-secrets-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): the name the kubeseal CLI looks for by default
  # (--controller-name sealed-secrets-controller in kube-system), so no flags are needed.
  fullnameOverride: sealed-secrets-controller
  ```

  **Defaults worth knowing**: Upstream chart values plus `fullnameOverride: sealed-secrets-controller`
  so `kubeseal` works without `--controller-name`. Installed once per cluster into `kube-system`.

  **Try it**
  ```
  kubectl create secret generic demo --from-literal=password=s3cret --dry-run=client -o yaml \
    | kubeseal --format yaml > demo-sealed.yaml
  kubectl apply -f demo-sealed.yaml
  ```

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://bitnami.github.io/sealed-secrets); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://github.com/bitnami-labs/sealed-secrets#usage) · [Chart](https://github.com/bitnami-labs/sealed-secrets/tree/main/helm/sealed-secrets) · [Default values](https://github.com/bitnami-labs/sealed-secrets/blob/main/helm/sealed-secrets/values.yaml) · [Releases](https://github.com/bitnami-labs/sealed-secrets/releases)
