overview: |
  ## Dapr

  Dapr (CNCF graduated) gives microservices portable building blocks through a sidecar:
  service-to-service invocation with mTLS, pub/sub, state stores, bindings, secrets, actors
  and workflows, configured with `Component` resources instead of SDK-specific code.

  **At a glance**
  - Chart: `dapr` 1.18.7, mirrored unchanged from https://dapr.github.io/helm-charts to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/dapr`
  - Installs into: namespace `dapr-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: dapr-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Upstream defaults (control plane in non-HA mode, mTLS
  on). Installed once per cluster into `dapr-system`. Annotate a Deployment with
  `dapr.io/enabled: "true"` and `dapr.io/app-id` to inject the sidecar.

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://dapr.github.io/helm-charts); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://docs.dapr.io/) · [Chart](https://github.com/dapr/dapr/tree/master/charts/dapr) · [Default values](https://github.com/dapr/dapr/blob/master/charts/dapr/values.yaml) · [Releases](https://github.com/dapr/dapr/releases)
