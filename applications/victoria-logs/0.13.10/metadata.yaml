displayName: VictoriaLogs
description: >-
  Fast, resource-efficient log database with full-text search and a built-in web UI (vmui).
  Lightweight alternative to Loki for labs and edge clusters. Installs into namespace victoria-logs.
  Web UI at /victoria-logs/select/vmui/ on the cluster ingress.
