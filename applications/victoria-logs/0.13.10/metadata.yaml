overview: |
  ## VictoriaLogs

  VictoriaLogs stores and searches logs with LogsQL at a fraction of the resources of
  Elasticsearch, and ships a web UI (vmui). It accepts logs from Fluent Bit, Vector,
  OpenTelemetry, Loki-compatible pushers and syslog.

  **At a glance**
  - Chart: `victoria-logs-single` 0.13.10 from `oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single`
  - Installs into: namespace `victoria-logs`, one instance per cluster
  - Web UI: `https://<cluster ingress>/victoria-logs/select/vmui/` (dashboard card on the cluster page)

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `victoria-logs-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): served natively under /victoria-logs on the NKP Traefik
  server:
    extraArgs:
      http.pathPrefix: /victoria-logs
    ingress:
      enabled: true
      ingressClassName: kommander-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - name: ""
          path:
            - /victoria-logs
          port: http
  ```

  **Defaults worth knowing**: Upstream chart values plus the NKP integration block: single-node server
  with a 10 GiB persistent volume, served at `https://<cluster ingress>/victoria-logs/` (UI at
  `/victoria-logs/select/vmui/`, dashboard card).

  **Access**: `https://<cluster ingress>/victoria-logs/select/vmui/` (dashboard card on the cluster page).

  **Feed it from the NKP Fluent Bit** (override on the fluent-bit platform app):
  ```
  [OUTPUT]
      Name  http
      Match *
      Host  victoria-logs-victoria-logs-single-server.victoria-logs
      Port  9428
      URI   /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.pod_name&_msg_field=log&_time_field=date
      Format json_lines
  ```

  **Links**: [Docs](https://docs.victoriametrics.com/victorialogs/) · [Chart](https://github.com/VictoriaMetrics/helm-charts/tree/master/charts/victoria-logs-single) · [Default values](https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-logs-single/values.yaml) · [Releases](https://github.com/VictoriaMetrics/helm-charts/releases)
