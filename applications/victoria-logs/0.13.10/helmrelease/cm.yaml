apiVersion: v1
data:
  values.yaml: |
    # --- NKP integration (lab catalog): served natively under /victoria-logs on the NKP Traefik
    server:
      extraArgs:
        http.pathPrefix: /victoria-logs
      ingress:
        enabled: true
        ingressClassName: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - name: ""
            path:
              - /victoria-logs
            port: http
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
---
