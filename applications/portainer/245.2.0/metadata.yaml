overview: |
  ## Portainer CE

  Portainer is a popular management UI for Kubernetes and Docker: browse and create workloads,
  services, volumes and Helm releases, manage registries and RBAC for teams that prefer a GUI
  over kubectl. The Community Edition is free.

  **At a glance**
  - Chart: `portainer` 245.2.0, mirrored unchanged from https://portainer.github.io/k8s to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/portainer`
  - Installs into: namespace `portainer`, one instance per cluster
  - Web UI: `https://portainer.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page)

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `portainer-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): reach Portainer through the NKP ingress (UI hostname
  # from the form) instead of the upstream NodePorts.
  service:
    type: ClusterIP
  ```

  **Defaults worth knowing**: Upstream chart values with `service.type: ClusterIP` (upstream opens
  NodePorts 30777/30779) so it is reached through the NKP ingress. Installed once per cluster
  into `portainer`, with a persistent volume.

  **Access**: when enabling, the form asks for the cluster **ingress domain** (for example
  `itcs-nkp-mgmt-prod.itcs.local` with a wildcard DNS record, or `<traefik-ip>.nip.io`); Portainer is then served on `https://portainer.<domain>/` and a
  card appears on the cluster page. Create the admin user within 5 minutes of the first start
  (Portainer locks the setup page afterwards; restart the pod to reopen it).

  **Ingress with a hostname**: the UI has no sub-path mode, so it is served as `portainer.<ingress domain>` and needs a DNS record (wildcard `*.<ingress domain>` to the NKP Traefik address, or `<traefik-ip>.nip.io`). The enable form writes exactly this ConfigMap; to set the host yourself, or from the CLI, create it and reference it in the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: portainer-config-overrides
    namespace: <workspace namespace>
  data:
    values.yaml: |
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: portainer.<ingress domain>
            paths:
              - path: /
  ```

  **NKP 2.18 notes**
  - Create the admin user within 5 minutes of the first start; Portainer locks the setup page afterwards (`/timeout.html`). `kubectl -n portainer rollout restart deploy/portainer` reopens it.

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://portainer.github.io/k8s); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://docs.portainer.io/) · [Chart](https://github.com/portainer/k8s/tree/master/charts/portainer) · [Default values](https://github.com/portainer/k8s/blob/master/charts/portainer/values.yaml) · [Releases](https://github.com/portainer/k8s/releases)
