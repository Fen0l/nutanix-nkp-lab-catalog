overview: |
  ## NGINX Ingress Controller

  `ingress-nginx` is the Kubernetes community ingress controller, the most widely deployed one.
  NKP ships Traefik as the platform ingress (`kommander-traefik`); this entry adds a second
  controller with the IngressClass **`nginx`** for workloads or customers that standardise on it.

  **At a glance**
  - Chart: `ingress-nginx` 4.15.1, mirrored unchanged from https://kubernetes.github.io/ingress-nginx to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/ingress-nginx`
  - Installs into: namespace `ingress-nginx`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: ingress-nginx-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Service of type LoadBalancer (MetalLB
  assigns an address), IngressClass `nginx`, not the cluster default, admission webhook on.
  Installed once per cluster into `ingress-nginx`.

  **Use it**: `kubectl -n ingress-nginx get svc ingress-nginx-controller` for the address, then
  `spec.ingressClassName: nginx` on your Ingress objects.

  **NKP 2.18 notes**
  - The controller Service takes a second LoadBalancer address from MetalLB next to the NKP Traefik; make sure the MetalLB pool has one free.

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://kubernetes.github.io/ingress-nginx); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://kubernetes.github.io/ingress-nginx/) · [Chart](https://github.com/kubernetes/ingress-nginx/tree/main/charts/ingress-nginx) · [Default values](https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml) · [Releases](https://github.com/kubernetes/ingress-nginx/releases)
