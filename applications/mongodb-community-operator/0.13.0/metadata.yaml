overview: |
  ## MongoDB Community Operator

  MongoDB's community operator deploys and manages replica sets from a `MongoDBCommunity`
  resource: members, version, users (SCRAM), TLS with cert-manager, storage.

  **At a glance**
  - Chart: `community-operator` 0.13.0, mirrored unchanged from https://mongodb.github.io/helm-charts to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/community-operator`
  - Installs into: namespace `mongodb`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: mongodb-community-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into
  `mongodb`; as upstream it **watches its own namespace**, so create `MongoDBCommunity`
  resources in `mongodb` (override `operator.watchNamespace: "*"` to watch all).

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://mongodb.github.io/helm-charts); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://github.com/mongodb/mongodb-kubernetes/tree/master/docs/mongodbcommunity) · [Chart](https://github.com/mongodb/helm-charts/tree/main/charts/community-operator) · [Default values](https://github.com/mongodb/helm-charts/blob/main/charts/community-operator/values.yaml) · [Releases](https://github.com/mongodb/helm-charts/releases)
