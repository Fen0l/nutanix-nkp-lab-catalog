overview: |
  ## vCluster

  vCluster (Loft, CNCF sandbox) runs a complete virtual Kubernetes control plane inside a
  namespace of the host cluster. Pods are scheduled on the host cluster; the virtual cluster has
  its own API server, CRDs and RBAC. Ideal for ephemeral environments, CI and training labs
  without creating NKP workload clusters.

  **At a glance**
  - Chart: `vcluster` 0.37.3, mirrored unchanged from https://charts.loft.sh to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/vcluster`
  - Installs into: one instance per AppDeployment, each in its own namespace
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: vcluster-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Upstream defaults (k8s distro, embedded database backing
  store, persistent volume). Each AppDeployment is one virtual cluster, in its own namespace.

  **Connect**
  ```
  vcluster connect <instance> -n <namespace>   # vcluster CLI, opens a kubeconfig context
  ```

  **NKP 2.19 notes**
  - The chart uses the chart version as the syncer image tag. NKP 2.19 runs helm-controller with `DisableChartDigestTracking=true`, so the tag is `0.37.3`; on a Flux that tracks chart digests the tag becomes `0.37.3+<digest>`, an invalid image reference.

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://charts.loft.sh); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://www.vcluster.com/docs) · [Chart](https://github.com/loft-sh/vcluster/tree/main/chart) · [Default values](https://github.com/loft-sh/vcluster/blob/main/chart/values.yaml) · [Releases](https://github.com/loft-sh/vcluster/releases)
