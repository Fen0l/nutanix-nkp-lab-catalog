schema: catalog.nkp.nutanix.com/v1/application-user-inputs
# Declarative input form shown by the NKP UI when enabling the application (NKP 2.18+).
# openbao's web UI needs its own hostname (no sub-path support upstream). The form asks for the
# cluster's ingress domain and serves the UI at openbao.<domain> on the NKP Traefik, rendering the chart
# overrides and the NKP dashboard card.
groups:
  - name: exposure
    label: Web UI
    description: >-
      Expose the OpenBao on the cluster's NKP ingress (Traefik) as openbao.<ingress domain>.
      Use the cluster's ingress domain (for example nkp.example.com) with a wildcard DNS
      record *.<domain> pointing at the Traefik address, or <traefik-ip>.nip.io when no DNS is available.
    collapse: false
    fields:
      - name: ingressDomain
        label: Ingress domain
        type: string
        description: Cluster ingress domain; the UI is served at openbao.<domain> (needs *.<domain> -> Traefik).
        required: true
        default: ""
resources:
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openbao-config-overrides
      data:
        values.yaml: |
          ui:
            enabled: true
          server:
            ingress:
              enabled: true
              ingressClassName: kommander-traefik
              annotations:
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: openbao.{{ ingressDomain }}
                  paths: []
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openbao-app-dashboard-info
        labels:
          kommander.d2iq.io/application: openbao
      data:
        name: OpenBao
        dashboardLink: https://openbao.{{ ingressDomain }}/ui/
        docsLink: https://openbao.org/docs/
        version: "0.30.4"
