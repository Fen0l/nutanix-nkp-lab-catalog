overview: |
  ## k6 Operator

  The k6 Operator runs Grafana k6 load tests inside the cluster. A `TestRun` resource points at a
  k6 script stored in a ConfigMap and fans the test out over several runner pods; results can be
  sent to Prometheus remote write or Grafana Cloud.

  **At a glance**
  - Chart: `k6-operator` 4.6.0 from `oci://ghcr.io/grafana/helm-charts/k6-operator`
  - Installs into: namespace `k6-operator-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: k6-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into
  `k6-operator-system`.

  **Try it**
  ```
  kubectl create configmap my-test --from-file=test.js
  ```
  ```yaml
  apiVersion: k6.io/v1alpha1
  kind: TestRun
  metadata: { name: my-test }
  spec:
    parallelism: 2
    script: { configMap: { name: my-test, file: test.js } }
  ```

  **Links**: [Docs](https://grafana.com/docs/k6/latest/set-up/set-up-distributed-k6/) · [Chart](https://github.com/grafana/k6-operator/tree/main/charts/k6-operator) · [Default values](https://github.com/grafana/k6-operator/blob/main/charts/k6-operator/values.yaml) · [Releases](https://github.com/grafana/k6-operator/releases)
