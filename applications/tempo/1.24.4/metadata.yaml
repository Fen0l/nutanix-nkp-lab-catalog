overview: |
  ## Grafana Tempo

  Tempo is a cost-efficient tracing backend that needs only object storage (or a local volume in
  the lab) and integrates natively with Grafana. This entry uses the **single-binary** chart, right
  for labs and per-project tracing; use `tempo-distributed` for production scale.

  **At a glance**
  - Chart: `tempo` 1.24.4 from `oci://ghcr.io/grafana/helm-charts/tempo`
  - Installs into: one instance per AppDeployment, each in its own namespace
  - Web UI: none of its own; add it as a data source in the NKP Grafana

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: tempo-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Receivers for OTLP (4317/4318), Jaeger
  and Zipkin, 10 GiB persistent volume. Multiple instances allowed; each instance is a Helm
  release named after the AppDeployment.

  **Wire it up**
  - OpenTelemetry Collector exporter: `otlp: { endpoint: <instance>-tempo.<namespace>:4317, tls: { insecure: true } }`
  - Grafana data source (NKP Centralized Grafana): type Tempo, URL `http://<instance>-tempo.<namespace>:3200`

  **Links**: [Docs](https://grafana.com/docs/tempo/latest/) · [Chart](https://github.com/grafana/helm-charts/tree/main/charts/tempo) · [Default values](https://github.com/grafana/helm-charts/blob/main/charts/tempo/values.yaml) · [Releases](https://github.com/grafana/helm-charts/releases)
