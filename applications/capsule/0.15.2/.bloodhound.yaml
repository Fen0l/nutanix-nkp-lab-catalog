# Validation-only config for `nkp validate catalog-repository` (bloodhound). Not used at deploy time.
k8s_versions:
  - 1.34.0
  - 1.35.0
strict: true
skip_types:
  - capsule.clastix.io/v1beta2
# CRDs of resources this chart renders (installed by a dependency, not by this app).
additional_crds:
  - https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/crds/cert-manager.io_certificates.yaml
  - https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/crds/cert-manager.io_issuers.yaml
substitution_vars:
  releaseNamespace: kommander
  workspaceNamespace: workspace
