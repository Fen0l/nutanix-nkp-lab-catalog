overview: |
  ## Capsule

  Capsule implements a multi-tenant and policy-based environment: a `Tenant` owns many
  namespaces, and Capsule enforces resource quotas, LimitRanges, network policies, allowed
  storage/ingress classes and node selectors across them.

  NKP already offers workspaces and projects for tenancy; Capsule is offered for teams evaluating
  namespace-as-a-service inside a single cluster.

  **At a glance**
  - Chart: `capsule` 0.15.2 from `oci://ghcr.io/projectcapsule/charts/capsule`
  - Installs into: namespace `capsule-system`, one instance per cluster
  - Web UI: none (operator / controller)
  - Requires: `cert-manager` (installed first, enforced by the UI)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: capsule-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into
  `capsule-system`. Users in the `projectcapsule.dev` group become tenant owners.

  **Requires**: cert-manager (NKP platform application) for its webhook certificates (upstream default).

  **Example**
  ```yaml
  apiVersion: capsule.clastix.io/v1beta2
  kind: Tenant
  metadata: { name: team-a }
  spec:
    owners: [ { name: alice, kind: User } ]
    namespaceOptions: { quota: 3 }
  ```

  **Links**: [Docs](https://projectcapsule.dev/docs/) · [Chart](https://github.com/projectcapsule/capsule/tree/main/charts/capsule) · [Default values](https://github.com/projectcapsule/capsule/blob/main/charts/capsule/values.yaml) · [Releases](https://github.com/projectcapsule/capsule/releases)
