overview: |
  ## Tetragon

  Tetragon (Cilium project, CNCF) observes and enforces at the kernel level with eBPF: process
  execution with full ancestry, file access, network connections and privilege changes, exported
  as JSON events. `TracingPolicy` resources add targeted detection and, if wanted, in-kernel
  enforcement (SIGKILL). It runs next to the NKP Cilium CNI.

  **At a glance**
  - Chart: `tetragon` 1.7.1, mirrored unchanged from https://helm.cilium.io to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/tetragon`
  - Installs into: namespace `kube-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: tetragon-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Upstream defaults (events to stdout, operator and agent
  DaemonSet in `kube-system`).

  **Try it**: `kubectl -n kube-system exec ds/tetragon -c tetragon -- tetra getevents -o compact`

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://helm.cilium.io); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://tetragon.io/docs/) · [Chart](https://github.com/cilium/tetragon/tree/main/install/kubernetes/tetragon) · [Default values](https://github.com/cilium/tetragon/blob/main/install/kubernetes/tetragon/values.yaml) · [Releases](https://github.com/cilium/tetragon/releases)
