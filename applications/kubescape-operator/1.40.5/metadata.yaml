overview: |
  ## Kubescape Operator

  Kubescape (CNCF) scans the cluster against security frameworks (NSA-CISA, MITRE ATT&CK,
  CIS), scans images for vulnerabilities with relevancy filtering, and can generate network
  policies and seccomp profiles from observed runtime behaviour.

  **At a glance**
  - Chart: `kubescape-operator` 1.40.5, mirrored unchanged from https://kubescape.github.io/helm-charts to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/kubescape-operator`
  - Installs into: namespace `kubescape`, one instance per cluster
  - Web UI: none of its own; the Headlamp entry ships the Kubescape plugin

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: kubescape-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Upstream defaults (`clusterName: cluster`, operator in
  standalone mode, no SaaS account). Installed once per cluster into `kubescape`.

  **Lab override example**
  ```yaml
  clusterName: lab-itcs-nkp-mgmt
  capabilities:
    continuousScan: enable
  ```

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://kubescape.github.io/helm-charts). This catalog mirrors the unmodified chart tarball
  to an OCI registry because NKP catalog applications require OCI charts.

  **Links**: [Docs](https://kubescape.io/docs/) · [Chart](https://github.com/kubescape/helm-charts) · [Releases](https://github.com/kubescape/helm-charts/releases)
