schema: catalog.nkp.nutanix.com/v1/application-user-inputs
# Declarative input form shown by the NKP UI when enabling the application (NKP 2.18+).
# litmus's web UI needs its own hostname (no sub-path support upstream). The form asks for the
# cluster's ingress domain and serves the UI at litmus.<domain> on the NKP Traefik, rendering the chart
# overrides and the NKP dashboard card.
groups:
  - name: exposure
    label: Web UI
    description: >-
      Expose the Litmus ChaosCenter on the cluster's NKP ingress (Traefik) as litmus.<ingress domain>.
      Use the cluster's ingress domain (for example nkp.example.com) with a wildcard DNS
      record *.<domain> pointing at the Traefik address, or <traefik-ip>.nip.io when no DNS is available.
    collapse: false
    fields:
      - name: ingressDomain
        label: Ingress domain
        type: string
        description: Cluster ingress domain; the UI is served at litmus.<domain> (needs *.<domain> -> Traefik).
        required: true
        default: ""
resources:
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litmus-config-overrides
      data:
        values.yaml: |
          ingress:
            enabled: true
            ingressClassName: kommander-traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
            host:
              name: litmus.{{ ingressDomain }}
              frontend:
                path: /
                pathType: Prefix
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litmus-app-dashboard-info
        labels:
          kommander.d2iq.io/application: litmus
      data:
        name: Litmus ChaosCenter
        dashboardLink: https://litmus.{{ ingressDomain }}/
        docsLink: https://docs.litmuschaos.io/
        version: "3.30.0"
