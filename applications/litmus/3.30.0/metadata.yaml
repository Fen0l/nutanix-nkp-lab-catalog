overview: |
  ## LitmusChaos

  LitmusChaos (CNCF incubating) runs chaos experiments (pod delete, network latency, node
  drain, CPU/memory hog...) from the ChaosHub and measures resilience with probes, all from the
  **ChaosCenter** web UI with experiment workflows and scheduling.

  **At a glance**
  - Chart: `litmus` 3.30.0 from `oci://ghcr.io/litmuschaos/litmus-helm/litmus`
  - Installs into: namespace `litmus`, one instance per cluster
  - Web UI: `https://litmus.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: litmus-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: ChaosCenter (frontend, auth and graphql
  servers) with its own 3-node MongoDB replica set (persistent volumes). Installed once per cluster
  into `litmus`. First login `admin` / `litmus`.

  **Access**: when enabling, the form asks for the cluster **ingress domain** (for example
  `itcs-nkp-mgmt-prod.itcs.local` with a wildcard DNS record, or `<traefik-ip>.nip.io`); ChaosCenter is then served on `https://litmus.<domain>/` and a card
  appears on the cluster page.

  **Ingress with a hostname**: the UI has no sub-path mode, so it is served as `litmus.<ingress domain>` and needs a DNS record (wildcard `*.<ingress domain>` to the NKP Traefik address, or `<traefik-ip>.nip.io`). The enable form writes exactly this ConfigMap; to set the host yourself, or from the CLI, create it and reference it in the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: litmus-config-overrides
    namespace: <workspace namespace>
  data:
    values.yaml: |
      ingress:
        enabled: true
        ingressClassName: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        host:
          name: litmus.<ingress domain>
          frontend:
            path: /
            pathType: Prefix
  ```

  **NKP 2.19 notes**
  - The chart writes the chart version into the `app.kubernetes.io/version` label. NKP 2.19 runs helm-controller with `DisableChartDigestTracking=true`, so the label is `3.30.0` and the install succeeds; on a Flux that tracks chart digests the version becomes `3.30.0+<digest>` and the install fails on label validation.

  **Links**: [Docs](https://docs.litmuschaos.io/) · [ChaosHub](https://hub.litmuschaos.io/) · [Chart](https://github.com/litmuschaos/litmus-helm/tree/master/charts/litmus) · [Default values](https://github.com/litmuschaos/litmus-helm/blob/master/charts/litmus/values.yaml) · [Releases](https://github.com/litmuschaos/litmus-helm/releases)
