overview: |
  ## Kured

  Kured watches each node for a reboot sentinel, then cordons, drains and reboots nodes one at a
  time while holding a cluster-wide lock, so patched kernels are activated without an outage.

  **At a glance**
  - Chart: `kured` 6.1.0 from `oci://ghcr.io/kubereboot/charts/kured`
  - Installs into: namespace `kube-system`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: kured-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Sentinel file `/var/run/reboot-required`
  (Debian/Ubuntu convention). Installed once per cluster into `kube-system`.

  **Lab override example** (Rocky Linux / RHEL nodes as used by NKP images):
  ```yaml
  configuration:
    rebootSentinelCommand: "sh -c 'dnf needs-restarting -r; test $? -eq 1'"
    period: 1h
    startTime: "02:00"
    endTime: "05:00"
    timeZone: Europe/Luxembourg
  ```
  Note: NKP node images are rebuilt with `nkp create image` for OS updates; Kured is for labs
  that patch nodes in place.

  **Links**: [Docs](https://kured.dev/docs/) · [Chart](https://github.com/kubereboot/charts/tree/main/charts/kured) · [Default values](https://github.com/kubereboot/charts/blob/main/charts/kured/values.yaml) · [Releases](https://github.com/kubereboot/charts/releases)
