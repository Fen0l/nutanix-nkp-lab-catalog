overview: |
  ## OpenTelemetry Collector

  The OpenTelemetry Collector receives telemetry (OTLP, Prometheus, Jaeger, Zipkin...),
  processes it and exports it to any backend. This entry deploys the collector directly with
  the upstream Helm chart; the OpenTelemetry **Operator** is available separately in the
  Nutanix product catalog.

  **At a glance**
  - Chart: `opentelemetry-collector` 0.175.1 from `oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector`
  - Installs into: one instance per AppDeployment, each in its own namespace
  - Web UI: none; export to Tempo or VictoriaLogs from this catalog

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `opentelemetry-collector-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # Both values are mandatory in the upstream chart (it refuses to render without them).
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-k8s
  ```

  **Defaults worth knowing**: Upstream chart values plus the two values the chart requires:
  `mode: deployment` and `image.repository: otel/opentelemetry-collector-k8s`. The default
  pipeline receives OTLP on 4317/4318 and exports to the debug exporter.

  **Lab override example** (per-node agent collecting logs and kubelet metrics):
  ```yaml
  mode: daemonset
  presets:
    logsCollection:
      enabled: true
    kubeletMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
  ```

  **Links**: [Docs](https://opentelemetry.io/docs/platforms/kubernetes/helm/collector/) · [Chart](https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector) · [Default values](https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/values.yaml) · [Releases](https://github.com/open-telemetry/opentelemetry-helm-charts/releases)
