overview: |
  ## Redis Operator (OpsTree)

  The OT-Container-Kit Redis Operator manages Redis / Valkey deployments from custom resources:
  `Redis` (standalone), `RedisReplication`, `RedisSentinel` and `RedisCluster`, with persistence,
  TLS, exporters and in-place upgrades.

  **At a glance**
  - Chart: `redis-operator` 0.27.0, mirrored unchanged from https://ot-container-kit.github.io/helm-charts to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/redis-operator`
  - Installs into: namespace `redis-operator`, one instance per cluster
  - Web UI: none (operator / controller)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: redis-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into
  `redis-operator`; it watches all namespaces.

  **Example**
  ```yaml
  apiVersion: redis.redis.opstreelabs.in/v1beta2
  kind: Redis
  metadata: { name: cache }
  spec:
    kubernetesConfig: { image: quay.io/opstree/redis:v7.0.15 }
    storage: { volumeClaimTemplate: { spec: { resources: { requests: { storage: 1Gi } } } } }
  ```

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://ot-container-kit.github.io/helm-charts); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://ot-redis-operator.netlify.app/) · [Chart](https://github.com/OT-CONTAINER-KIT/helm-charts/tree/main/charts/redis-operator) · [Default values](https://github.com/OT-CONTAINER-KIT/helm-charts/blob/main/charts/redis-operator/values.yaml) · [Releases](https://github.com/OT-CONTAINER-KIT/helm-charts/releases)
