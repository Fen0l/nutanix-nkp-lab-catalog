overview: |
  ## Strimzi Kafka Operator

  Strimzi provides a way to run an Apache Kafka cluster on Kubernetes with custom resources:
  `Kafka`, `KafkaNodePool`, `KafkaTopic`, `KafkaUser`, `KafkaConnect`, `KafkaMirrorMaker2`.

  **At a glance**
  - Chart: `strimzi-kafka-operator` 1.3.0 from `oci://quay.io/strimzi-helm/strimzi-kafka-operator`
  - Installs into: namespace `kafka`, one instance per cluster
  - Web UI: none of its own; the Kafka UI entry browses the clusters

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: strimzi-kafka-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: The operator is installed once per cluster
  into the `kafka` namespace and, as upstream, **watches only its own namespace**: create Kafka
  clusters in `kafka`.

  **Lab override example** (watch every namespace):
  ```yaml
  watchAnyNamespace: true
  ```

  **First cluster**: apply the upstream single-node KRaft example from the Strimzi quickstart, with the
  Nutanix CSI `nutanix-volume` storage class for persistent brokers.

  **Links**: [Docs](https://strimzi.io/documentation/) · [Quickstart](https://strimzi.io/quickstarts/) · [Chart](https://github.com/strimzi/strimzi-kafka-operator/tree/main/helm-charts/helm3/strimzi-kafka-operator) · [Default values](https://github.com/strimzi/strimzi-kafka-operator/blob/main/helm-charts/helm3/strimzi-kafka-operator/values.yaml) · [Releases](https://github.com/strimzi/strimzi-kafka-operator/releases)
