overview: |
  ## Falco

  Falco is the CNCF runtime security engine. It runs as a DaemonSet and uses an eBPF probe
  to watch system calls, raising alerts on suspicious activity (shell in a container,
  sensitive file reads, privilege escalation).

  **At a glance**
  - Chart: `falco` 9.2.2 from `oci://ghcr.io/falcosecurity/charts/falco`
  - Installs into: namespace `falco`, one instance per cluster
  - Web UI: `https://falco.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page)

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `falco-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): Falcosidekick (event forwarder) and its web UI on, so Falco
  # alerts are visible without a log tail. The UI hostname comes from the form at enable time.
  falcosidekick:
    enabled: true
    webui:
      enabled: true
  ```

  **Defaults worth knowing**: Upstream chart values (`driver.kind: auto`, the modern eBPF probe on
  recent kernels) plus the NKP integration block: **Falcosidekick and its web UI enabled**, so
  alerts are browsable. Installed once per cluster into the `falco` namespace.

  **Access**: when enabling, the form asks for the cluster **ingress domain** (for example
  `itcs-nkp-mgmt-prod.itcs.local` with a wildcard DNS record, or `<traefik-ip>.nip.io`); the Falcosidekick UI is then served on `https://falco.<domain>/`
  (login `admin` / `admin`) and a card appears on the cluster page.

  **Ingress with a hostname**: the UI has no sub-path mode, so it is served as `falco.<ingress domain>` and needs a DNS record (wildcard `*.<ingress domain>` to the NKP Traefik address, or `<traefik-ip>.nip.io`). The enable form writes exactly this ConfigMap; to set the host yourself, or from the CLI, create it and reference it in the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: falco-config-overrides
    namespace: <workspace namespace>
  data:
    values.yaml: |
      falcosidekick:
        enabled: true
        webui:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: kommander-traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - host: falco.<ingress domain>
                paths:
                  - path: /
  ```

  **Try it**: `kubectl -n falco logs -l app.kubernetes.io/name=falco -f`, then open a shell
  in any pod to trigger the `Terminal shell in container` rule.

  **Links**: [Docs](https://falco.org/docs/) · [Chart](https://github.com/falcosecurity/charts/tree/master/charts/falco) · [Default values](https://github.com/falcosecurity/charts/blob/master/charts/falco/values.yaml) · [Releases](https://github.com/falcosecurity/charts/releases)
