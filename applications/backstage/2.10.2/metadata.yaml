overview: |
  ## Backstage

  Backstage is the CNCF framework for internal developer portals: a software catalog of services and
  owners, scaffolder templates, TechDocs and a plugin ecosystem.

  **At a glance**
  - Chart: `backstage` 2.10.2 from `oci://ghcr.io/backstage/charts/backstage`
  - Installs into: one instance per AppDeployment, each in its own namespace
  - Web UI: `https://backstage.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page)

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: backstage-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: The chart deploys the generic
  `ghcr.io/backstage/backstage:latest` demo image with an in-memory SQLite database and no
  PostgreSQL. Good for a tour; a real portal needs your own Backstage app image and `app-config`.

  **Access**: `https://backstage.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page).

  **Ingress with a hostname**: the UI has no sub-path mode, so it is served as `backstage.<ingress domain>` and needs a DNS record (wildcard `*.<ingress domain>` to the NKP Traefik address, or `<traefik-ip>.nip.io`). The enable form writes exactly this ConfigMap; to set the host yourself, or from the CLI, create it and reference it in the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: backstage-config-overrides
    namespace: <workspace namespace>
  data:
    values.yaml: |
      ingress:
        enabled: true
        className: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        host: backstage.<ingress domain>
      backstage:
        appConfig:
          app:
            baseUrl: https://backstage.<ingress domain>
          backend:
            baseUrl: https://backstage.<ingress domain>
            cors:
              origin: https://backstage.<ingress domain>
  ```

  **Lab override example** (your image, PostgreSQL from the chart):
  ```yaml
  backstage:
    image: { registry: harbor.example.com, repository: platform/backstage, tag: "1.0.0" }
    appConfig:
      app: { baseUrl: https://backstage.example.com }
      backend: { baseUrl: https://backstage.example.com }
  postgresql:
    enabled: true
  ```
  `kubectl -n <namespace> port-forward svc/<instance> 7007:7007` opens the portal.

  **NKP 2.19 notes**
  - The demo image uses an in-memory SQLite database: catalog entities are lost when the pod restarts. Set `postgresql.enabled: true` for anything persistent.

  **Links**: [Docs](https://backstage.io/docs/) · [Chart](https://github.com/backstage/charts/tree/main/charts/backstage) · [Default values](https://github.com/backstage/charts/blob/main/charts/backstage/values.yaml) · [Releases](https://github.com/backstage/charts/releases)
