overview: |
  ## Trivy Operator

  The Trivy Operator continuously scans the cluster and stores results as custom resources:
  `VulnerabilityReport`, `ConfigAuditReport`, `ExposedSecretReport`, `RbacAssessmentReport`,
  `SbomReport`, `ClusterComplianceReport`.

  **At a glance**
  - Chart: `trivy-operator` 0.32.1 from `oci://ghcr.io/aquasecurity/helm-charts/trivy-operator`
  - Installs into: namespace `trivy-system`, one instance per cluster
  - Web UI: none of its own; the Policy Reporter entry shows the reports

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: trivy-operator-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Upstream defaults (all namespaces scanned, Trivy in
  standalone mode, vulnerability DB downloaded from GHCR). Installed once per cluster into
  `trivy-system`.

  **Try it**: `kubectl get vulnerabilityreports -A` a few minutes after install.

  **Lab override example** (limit scanning to selected namespaces):
  ```yaml
  targetNamespaces: "demo,default"
  ```

  **Links**: [Docs](https://aquasecurity.github.io/trivy-operator/) · [Chart](https://github.com/aquasecurity/trivy-operator/tree/main/deploy/helm) · [Default values](https://github.com/aquasecurity/trivy-operator/blob/main/deploy/helm/values.yaml) · [Releases](https://github.com/aquasecurity/trivy-operator/releases)
