overview: |
  ## Gitea

  Gitea is a painless self-hosted Git service: repositories, issues, pull requests, a
  container/package registry and Gitea Actions (GitHub Actions compatible CI).
  Use it as the Git source for Flux or Argo CD demos without leaving the lab.

  **At a glance**
  - Chart: `gitea` 12.7.0 from `oci://docker.gitea.com/charts/gitea`
  - Installs into: one instance per AppDeployment, each in its own namespace
  - Web UI: `https://gitea.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page)

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `gitea-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # The upstream chart computes HTTP_PORT / SSH_LISTEN_PORT in a helper template, so a
  # static render (what `nkp validate catalog-repository` does) leaves the Service
  # targetPort empty and fails strict schema validation. Pinning the chart's own defaults
  # makes the rendered manifests valid without changing runtime behaviour.
  gitea:
    config:
      server:
        HTTP_PORT: 3000
        SSH_LISTEN_PORT: 2222
  # Single replica on a ReadWriteOnce volume: the upstream RollingUpdate strategy cannot start the new
  # pod while the old one holds the volume (Multi-Attach error), so every upgrade would stall.
  strategy:
    type: Recreate
  ```

  **Defaults worth knowing**: Upstream chart values plus the two technical changes listed above. The upstream chart deploys a
  highly-available PostgreSQL (`postgresql-ha`) and a Valkey cluster by default (several
  pods, persistent volumes required). Admin user `gitea_admin` with the chart's default
  password (change it with `gitea.admin.password`).

  **Access**: `https://gitea.<ingress domain>/` (domain asked when enabling; dashboard card on the cluster page).

  **Ingress with a hostname**: the UI has no sub-path mode, so it is served as `gitea.<ingress domain>` and needs a DNS record (wildcard `*.<ingress domain>` to the NKP Traefik address, or `<traefik-ip>.nip.io`). The enable form writes exactly this ConfigMap; to set the host yourself, or from the CLI, create it and reference it in the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: gitea-config-overrides
    namespace: <workspace namespace>
  data:
    values.yaml: |
      ingress:
        enabled: true
        className: kommander-traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: gitea.<ingress domain>
            paths:
              - path: /
                pathType: Prefix
      gitea:
        config:
          server:
            DOMAIN: gitea.<ingress domain>
            ROOT_URL: https://gitea.<ingress domain>/
  ```

  **Lab override example** (single pod, SQLite, no database or cache pods):
  ```yaml
  postgresql-ha:
    enabled: false
  valkey-cluster:
    enabled: false
  gitea:
    config:
      database:
        DB_TYPE: sqlite3
      session:
        PROVIDER: memory
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
  ```

  **Try it**: `kubectl -n <namespace> port-forward svc/<instance>-http 3000:3000` then open http://localhost:3000

  **NKP 2.18 notes**
  - Upstream deploys PostgreSQL HA and a Valkey cluster by default (nine pods, six volumes); use the override above for a one-pod lab instance.
  - Upgrades recreate the single pod (Recreate strategy): expect a short outage on each bump.

  **Links**: [Docs](https://docs.gitea.com/) · [Chart](https://gitea.com/gitea/helm-gitea)
