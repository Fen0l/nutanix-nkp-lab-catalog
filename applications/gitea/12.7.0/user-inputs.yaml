schema: catalog.nkp.nutanix.com/v1/application-user-inputs
# Declarative input form shown by the NKP UI when enabling the application (NKP 2.18+).
# gitea's web UI needs its own hostname (no sub-path support upstream). The form asks for the
# cluster's ingress domain and serves the UI at gitea.<domain> on the NKP Traefik, rendering the chart
# overrides and the NKP dashboard card.
groups:
  - name: exposure
    label: Web UI
    description: >-
      Expose the Gitea on the cluster's NKP ingress (Traefik) as gitea.<ingress domain>.
      Use the cluster's ingress domain (for example nkp.example.com) with a wildcard DNS
      record *.<domain> pointing at the Traefik address, or <traefik-ip>.nip.io when no DNS is available.
    collapse: false
    fields:
      - name: ingressDomain
        label: Ingress domain
        type: string
        description: Cluster ingress domain; the UI is served at gitea.<domain> (needs *.<domain> -> Traefik).
        required: true
        default: ""
resources:
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gitea-config-overrides
      data:
        values.yaml: |
          ingress:
            enabled: true
            className: kommander-traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - host: gitea.{{ ingressDomain }}
                paths:
                  - path: /
                    pathType: Prefix
          gitea:
            config:
              server:
                DOMAIN: gitea.{{ ingressDomain }}
                ROOT_URL: https://gitea.{{ ingressDomain }}/
  - template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gitea-app-dashboard-info
        labels:
          kommander.d2iq.io/application: gitea
      data:
        name: Gitea
        dashboardLink: https://gitea.{{ ingressDomain }}/
        docsLink: https://docs.gitea.com/
        version: "12.7.0"
