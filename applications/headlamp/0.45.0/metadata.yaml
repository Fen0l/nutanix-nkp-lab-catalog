overview: |
  ## Headlamp

  Headlamp (CNCF) is a modern, extensible Kubernetes web UI. This entry turns it into the **UI layer
  of the catalog** for operators that have no interface of their own: it ships with the
  **Kubescape** plugin (compliance and vulnerability posture), the **Flux** plugin (sources,
  kustomizations, HelmReleases) and the **cert-manager** plugin.

  **At a glance**
  - Chart: `headlamp` 0.45.0, mirrored unchanged from https://kubernetes-sigs.github.io/headlamp/ to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/headlamp`
  - Installs into: namespace `headlamp`, one instance per cluster
  - Web UI: `https://<cluster ingress>/headlamp/` (dashboard card on the cluster page)
  - Works with: `kubescape-operator`, `cert-manager`

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `headlamp-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): serve Headlamp on the NKP Traefik ingress at /headlamp
  config:
    baseURL: /headlamp
  ingress:
    enabled: true
    ingressClassName: kommander-traefik
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - paths:
          - path: /headlamp
            type: Prefix
  # Plugins installed at start-up by the plugin-manager sidecar (fetched from ArtifactHub):
  # Kubescape (security posture UI), Flux (GitOps objects), cert-manager.
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: kubescape
          source: https://artifacthub.io/packages/headlamp/kubescape-headlamp-plugin/headlamp_kubescape
          version: 0.11.2
        - name: flux
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          version: 0.7.0
        - name: cert-manager
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          version: 0.1.1
      installOptions:
        parallel: true
        maxConcurrent: 3
  ```

  **Defaults worth knowing**: Upstream chart values plus the NKP integration block: served at
  `https://<cluster ingress>/headlamp/` (dashboard card on the cluster page), plugins fetched from
  ArtifactHub by the plugin-manager sidecar at start-up (internet access needed once), cluster-admin
  service account as upstream.

  **Login**: Headlamp asks for a token. Create one for its service account:
  ```
  kubectl -n headlamp create token headlamp --duration=24h
  ```
  For SSO, point `config.oidc` at the NKP Dex (see the chart values).

  **Access**: `https://<cluster ingress>/headlamp/` (dashboard card on the cluster page).

  **Works with**: Kubescape Operator (posture, vulnerabilities), Flux (built into NKP), cert-manager.

  **NKP 2.18 notes**
  - Plugins are downloaded from ArtifactHub when the pod starts, so the first start needs internet access (or a pre-populated plugins volume).

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository
  (https://kubernetes-sigs.github.io/headlamp/); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://headlamp.dev/docs/latest/) · [Plugins](https://artifacthub.io/packages/search?kind=21) · [Chart](https://github.com/kubernetes-sigs/headlamp/tree/main/charts/headlamp) · [Default values](https://github.com/kubernetes-sigs/headlamp/blob/main/charts/headlamp/values.yaml) · [Releases](https://github.com/kubernetes-sigs/headlamp/releases)
