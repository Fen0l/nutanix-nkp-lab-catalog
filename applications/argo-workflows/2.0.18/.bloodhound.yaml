# Validation-only config for `nkp validate catalog-repository` (bloodhound). Not used at deploy time.
k8s_versions:
  - 1.34.0
  - 1.35.0
strict: true
# Traefik CRD shipped by the NKP platform, not by this app.
skip_types:
  - traefik.io/v1alpha1
additional_crds: []
substitution_vars:
  releaseNamespace: kommander
  workspaceNamespace: workspace
