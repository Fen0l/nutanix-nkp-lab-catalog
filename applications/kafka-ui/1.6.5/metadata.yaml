overview: |
  ## Kafka UI (Kafbat)

  Kafbat UI (the community continuation of Provectus Kafka UI) is a web console for Apache
  Kafka: browse topics and messages, consumer groups and lag, brokers, schema registry and
  Kafka Connect. It is the natural UI for clusters created with the **Strimzi** entry.

  **At a glance**
  - Chart: `kafka-ui` 1.6.5, mirrored unchanged from https://ui.charts.kafbat.io to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/kafka-ui`
  - Installs into: namespace `kafka-ui`, one instance per cluster
  - Web UI: `https://<cluster ingress>/kafka-ui/` (dashboard card on the cluster page)
  - Works with: `strimzi-kafka-operator`

  **Changes from upstream**: the values this entry sets on top of the chart defaults. Override them with a `kafka-ui-config-overrides` ConfigMap (key `values.yaml`) referenced in the AppDeployment `spec.configOverrides`.
  ```yaml
  # --- NKP integration (lab catalog): served under /kafka-ui on the NKP Traefik; clusters are
  # added from the UI (dynamic config) so no bootstrap address is required at install.
  envs:
    config:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
      DYNAMIC_CONFIG_ENABLED: "true"
  ingress:
    enabled: true
    ingressClassName: kommander-traefik
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
    path: /kafka-ui
    pathType: Prefix
  ```

  **Defaults worth knowing**: Upstream chart values plus the NKP integration block: served at
  `https://<cluster ingress>/kafka-ui/` (dashboard card), dynamic configuration enabled so you
  add clusters from the UI.

  **Access**: `https://<cluster ingress>/kafka-ui/` (dashboard card on the cluster page).

  **Add a Strimzi cluster**: Configure → Add cluster → bootstrap servers
  `my-cluster-kafka-bootstrap.kafka:9092` (adapt the cluster name and namespace).

  **Chart source**: upstream publishes the chart only through an HTTP Helm repository (https://ui.charts.kafbat.io); this catalog mirrors the unmodified tarball to OCI.

  **Links**: [Docs](https://ui.docs.kafbat.io/) · [Chart](https://github.com/kafbat/helm-charts) · [Releases](https://github.com/kafbat/helm-charts/releases)
