overview: |
  ## KEDA

  KEDA (Kubernetes Event-driven Autoscaling) is a CNCF graduated project that drives the
  scaling of any Deployment, StatefulSet or Job from external event sources (Kafka, RabbitMQ,
  Prometheus queries, cron schedules, cloud queues) and supports scale-to-zero.

  **At a glance**
  - Chart: `keda` 2.21.0, mirrored unchanged from https://kedacore.github.io/charts to `oci://ghcr.io/fen0l/nutanix-nkp-lab-catalog/charts/keda`
  - Installs into: namespace `keda`, one instance per cluster
  - Web UI: none (operator); ScaledObjects are visible in Headlamp

  **Changes from upstream**: none, upstream chart defaults. To change a value, reference a ConfigMap from the AppDeployment `spec.configOverrides`:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata: { name: keda-config-overrides, namespace: <workspace namespace> }
  data:
    values.yaml: |
      # chart values, see the default values link below
  ```

  **Defaults worth knowing**: Installed once per cluster into the
  `keda` namespace with its CRDs (`ScaledObject`, `ScaledJob`, `TriggerAuthentication`).

  **Chart source**: the upstream project publishes the chart only through an HTTP Helm
  repository (https://kedacore.github.io/charts). This catalog mirrors the unmodified chart
  tarball to an OCI registry because NKP catalog applications require OCI charts.

  **Links**: [Docs](https://keda.sh/docs/) · [Scalers](https://keda.sh/docs/latest/scalers/) · [Chart](https://github.com/kedacore/charts) · [Releases](https://github.com/kedacore/charts/releases)
